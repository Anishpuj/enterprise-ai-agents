version: '3.8'

services:
  # Database
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: enterprise_agents
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secure_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - agent_network

  # Redis for caching and session management
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - agent_network

  # Research Agent
  research_agent:
    build: .
    command: python enterprise_research_agent.py
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql://admin:secure_password@postgres:5432/enterprise_agents
      - REDIS_URL=redis://redis:6379
    depends_on:
      - postgres
      - redis
    networks:
      - agent_network

  # Analysis Agent  
  analysis_agent:
    build: .
    command: python enterprise_analysis_agent.py
    ports:
      - "8002:8002"
    environment:
      - DATABASE_URL=postgresql://admin:secure_password@postgres:5432/enterprise_agents
      - REDIS_URL=redis://redis:6379
    depends_on:
      - postgres
      - redis
    networks:
      - agent_network

  # Report Agent
  report_agent:
    build: .
    command: python enterprise_report_agent.py
    ports:
      - "8003:8003"
    environment:
      - DATABASE_URL=postgresql://admin:secure_password@postgres:5432/enterprise_agents
      - REDIS_URL=redis://redis:6379
    depends_on:
      - postgres
      - redis
    networks:
      - agent_network

  # API Gateway
  api_gateway:
    build: .
    command: python api_gateway.py
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgresql://admin:secure_password@postgres:5432/enterprise_agents
      - REDIS_URL=redis://redis:6379
    depends_on:
      - postgres
      - redis
      - research_agent
      - analysis_agent
      - report_agent
    networks:
      - agent_network

  # Dashboard
  dashboard:
    build: .
    command: python dashboard.py
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://admin:secure_password@postgres:5432/enterprise_agents
    depends_on:
      - postgres
      - api_gateway
    networks:
      - agent_network

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - api_gateway
      - dashboard
    networks:
      - agent_network

  # Monitoring
  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - agent_network

  grafana:
    image: grafana/grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - agent_network

volumes:
  postgres_data:
  grafana_data:

networks:
  agent_network:
    driver: bridge
